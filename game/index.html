<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Quarterview ARPG — 프로토타입</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230d1017'/><path d='M16 5l10 6v10l-10 6-10-6V11z' fill='none' stroke='%23ffd479' stroke-width='2.4'/></svg>"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: #0d1017;
        font-family: system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif;
        color: #e8edf5;
        -webkit-user-select: none; user-select: none;
      }
      #game { display: block; width: 100%; height: 100%; cursor: crosshair; }

      /* --- HUD ---------------------------------------------------------- */
      #hud {
        position: fixed; inset: 0; pointer-events: none;
        display: flex; flex-direction: column; justify-content: space-between;
      }
      .hud-top {
        display: flex; justify-content: space-between; align-items: flex-start;
        padding: 14px 18px; gap: 12px;
      }
      .hud-bottom { padding: 0 18px 20px; display: flex; justify-content: center; }

      .panel {
        background: rgba(13, 16, 23, 0.72);
        border: 1px solid rgba(150, 175, 220, 0.18);
        border-radius: 10px;
        padding: 9px 13px;
        backdrop-filter: blur(6px);
        font-size: 12.5px; line-height: 1.55;
        font-variant-numeric: tabular-nums;
      }
      .panel b { color: #ffd479; font-weight: 600; }
      .dim { color: #8c9ab3; }

      #vitals { width: min(400px, 62vw); display: flex; flex-direction: column; gap: 7px; }
      .bar {
        position: relative; height: 17px; border-radius: 5px; overflow: hidden;
        background: rgba(8, 10, 15, 0.85);
        border: 1px solid rgba(150, 175, 220, 0.22);
      }
      .bar > .fill {
        position: absolute; inset: 0; transform-origin: left center;
        transition: transform 90ms linear;
      }
      #hpFill { background: linear-gradient(90deg, #c8362c, #f2604f); }
      /* 체력이 줄 때 뒤따라 내려오는 흰 잔상 — 얼마나 깎였는지 눈으로 보입니다. */
      #hpGhost { background: rgba(255, 235, 210, 0.35); transition: transform 420ms ease-out 180ms; }
      #stamFill { background: linear-gradient(90deg, #3f9d63, #66d492); }
      #vials { margin-top: 6px; font-size: 12px; color: #d8e2f0; letter-spacing: 0.02em; }
      #vials .dim { color: #7d8798; font-size: 11px; }
      #restHint {
        position: absolute; left: 50%; bottom: 148px; transform: translateX(-50%);
        display: none; text-align: center; font-size: 12px; color: #ffd9a0;
        background: rgba(12,14,20,0.72); padding: 6px 14px; border-radius: 8px;
        border: 1px solid rgba(255,169,60,0.35); pointer-events: none;
      }
      #restHint .bar { width: 140px; height: 5px; margin-top: 5px; }
      #restFill { background: linear-gradient(90deg, #ffa93c, #ffd479); }
      /*
        저체력 경고 — 화면 **가장자리**만 물들입니다.
        가운데를 덮으면 정작 읽어야 할 4색 예고를 가려서, 위험을 알리려던 것이
        위험을 못 보게 만듭니다. 가장자리는 시야의 주변부라 경고로는 충분하고
        전투 정보는 하나도 가리지 않습니다.
      */
      #lowHp {
        position: absolute; inset: 0; pointer-events: none; opacity: 0;
        background: radial-gradient(ellipse at center, rgba(0,0,0,0) 42%, rgba(190,24,32,0.72) 100%);
        transition: opacity 0.18s linear;
      }
      .bar > .label {
        position: absolute; inset: 0; display: flex; align-items: center;
        justify-content: space-between; padding: 0 8px;
        font-size: 11px; font-weight: 600; letter-spacing: 0.03em;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
      }

      /* --- 스킬바 --- */
      #loadout {
        display: flex; flex-direction: column; align-items: center; gap: 7px;
        margin-bottom: 10px; pointer-events: none;
      }
      #weaponName {
        font-size: 12px; color: #ffd479; font-weight: 600; letter-spacing: 0.02em;
        background: rgba(13,16,23,0.72); border: 1px solid rgba(150,175,220,0.18);
        border-radius: 7px; padding: 3px 11px; backdrop-filter: blur(6px);
      }
      #slots { display: flex; gap: 7px; }
      .slot {
        position: relative; width: 73px; height: 56px; overflow: hidden;
        background: rgba(13,16,23,0.82);
        border: 1px solid rgba(150,175,220,0.22); border-radius: 9px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        backdrop-filter: blur(6px);
      }
      .slot.empty { opacity: 0.42; }
      /* 쿨다운은 아래에서 위로 차오르는 어두운 판. 남은 시간이 한눈에 보입니다. */
      .slot .cd {
        position: absolute; left: 0; right: 0; bottom: 0;
        background: rgba(6,8,12,0.78); height: 0%;
        transition: height 80ms linear;
      }
      /* z-index 없이 두면 .key/.nm(position:relative)이 DOM 순서상 위에 그려져
         쿨다운 숫자가 이름 뒤에 가려집니다. 실제로 그렇게 나왔습니다. */
      .slot .cdText {
        position: absolute; inset: 0; z-index: 3;
        display: flex; align-items: center; justify-content: center;
        font-size: 20px; font-weight: 800; color: #ffd479; opacity: 0;
        text-shadow: 0 2px 6px rgba(0,0,0,1), 0 0 12px rgba(0,0,0,0.9);
      }
      .slot .key {
        position: relative; font-size: 10px; font-weight: 700; color: #8c9ab3;
        letter-spacing: 0.06em;
      }
      .slot .nm {
        position: relative; font-size: 10.5px; font-weight: 600; color: #e2e9f5;
        margin-top: 2px; text-align: center; line-height: 1.22; padding: 0 2px;
        word-break: keep-all;
      }
      .slot.ready .nm { color: #fff; }
      /* 쿨다운 중에는 이름을 눌러 두어 숫자가 잘 읽히게 합니다. */
      .slot:not(.ready) .nm, .slot:not(.ready) .key { opacity: 0.45; }
      .slot.ready { border-color: rgba(255, 212, 121, 0.5); }

      #controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
      .key {
        background: rgba(13, 16, 23, 0.72);
        border: 1px solid rgba(150, 175, 220, 0.18);
        border-radius: 8px; padding: 6px 11px; font-size: 12px;
        backdrop-filter: blur(6px);
      }
      .key kbd {
        display: inline-block; min-width: 20px; text-align: center;
        background: #2b3444; border: 1px solid #465268; border-bottom-width: 2px;
        border-radius: 4px; padding: 1px 5px; margin-right: 5px;
        font-family: inherit; font-size: 11px; font-weight: 600; color: #dbe4f2;
      }


      /* --- 트라이포드 창 --- */
      #tripod {
        position: fixed; right: 0; top: 0; bottom: 0; width: min(460px, 92vw);
        background: rgba(9, 12, 18, 0.94);
        border-left: 1px solid rgba(150, 175, 220, 0.2);
        backdrop-filter: blur(10px);
        transform: translateX(100%); transition: transform 200ms ease;
        pointer-events: auto; display: flex; flex-direction: column;
        z-index: 5;
      }
      #tripod.show { transform: translateX(0); }
      .tpTop {
        display: flex; align-items: center; justify-content: space-between;
        padding: 14px 16px 10px; border-bottom: 1px solid rgba(150, 175, 220, 0.16);
      }
      .tpTop h2 { font-size: 15px; font-weight: 700; color: #ffd479; }
      .tpTop .sub { font-size: 11.5px; color: #8c9ab3; margin-top: 2px; }
      #tripodClose {
        pointer-events: auto; background: none; border: 1px solid rgba(150,175,220,0.25);
        color: #cbd6e8; border-radius: 7px; padding: 5px 10px; font: inherit;
        font-size: 12px; cursor: pointer;
      }
      #tripodBody { overflow-y: auto; padding: 12px 16px 24px; }
      .tpEmpty { color: #8c9ab3; font-size: 12.5px; padding: 20px 0; text-align: center; }
      .tpSkill {
        border: 1px solid rgba(150,175,220,0.16); border-radius: 10px;
        padding: 10px 11px; margin-bottom: 11px; background: rgba(20,25,35,0.6);
      }
      .tpHead {
        display: flex; align-items: center; gap: 8px;
        font-size: 13.5px; font-weight: 700; color: #e8edf5; margin-bottom: 8px;
      }
      .tpKey {
        display: inline-block; min-width: 20px; text-align: center;
        background: #2b3444; border: 1px solid #465268; border-radius: 4px;
        padding: 1px 5px; font-size: 11px; color: #ffd479;
      }
      .tpTierName { font-size: 11px; color: #8c9ab3; margin: 7px 0 4px; letter-spacing: 0.02em; }
      .tpOpts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .tpOpt {
        pointer-events: auto; text-align: left; font: inherit; cursor: pointer;
        background: rgba(30,38,52,0.85); border: 1px solid rgba(150,175,220,0.18);
        border-radius: 8px; padding: 7px 9px; color: #dbe4f2;
        display: flex; flex-direction: column; gap: 3px;
      }
      .tpOpt b { font-size: 12.5px; color: #fff; font-weight: 650; }
      .tpOpt span { font-size: 10.5px; line-height: 1.35; color: #9fb0c8; }
      .tpOpt:hover:not(:disabled) { border-color: rgba(255,212,121,0.5); }
      .tpOpt.sel { border-color: #ffd479; background: rgba(255,212,121,0.13); }
      .tpOpt.sel b { color: #ffd479; }
      .tpOpt.locked { opacity: 0.45; }
      .tpOpt:disabled { cursor: default; }

      .saveNote {
        font-size: 11px; margin-top: 3px; opacity: 0;
        transition: opacity 220ms ease;
      }
      .saveNote.show { opacity: 1; }

      .tpFoot {
        border-top: 1px solid rgba(150,175,220,0.16); padding: 11px 16px 14px;
        display: flex; align-items: center; gap: 10px;
      }
      .tpFoot span { font-size: 10.5px; color: #8c9ab3; line-height: 1.35; }
      #resetProgress {
        pointer-events: auto; flex: none; font: inherit; font-size: 12px; cursor: pointer;
        background: rgba(200, 70, 60, 0.16); border: 1px solid rgba(230, 110, 95, 0.5);
        color: #ffb3a7; border-radius: 7px; padding: 6px 12px;
      }
      #resetProgress:hover { background: rgba(200, 70, 60, 0.3); }

      #banner {
        position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%);
        text-align: center; pointer-events: none; opacity: 0;
        transition: opacity 260ms ease;
      }
      #banner.show { opacity: 1; }
      #banner .big {
        font-size: clamp(30px, 6vw, 58px); font-weight: 800; letter-spacing: 0.02em;
        text-shadow: 0 4px 26px rgba(0, 0, 0, 0.85);
      }
      #banner .sub { margin-top: 8px; font-size: 14px; color: #b9c6dc; }

      #restart {
        pointer-events: auto; margin-top: 18px; padding: 11px 26px;
        font: inherit; font-size: 15px; font-weight: 600; color: #0d1017;
        background: #ffd479; border: none; border-radius: 9px; cursor: pointer;
        display: none;
      }
      #restart:hover { background: #ffe0a0; }

      @media (max-width: 620px) {
        #controls { display: none; }
        #vitals { width: 68vw; }
        .slot { width: 52px; height: 44px; }
        .slot .nm { font-size: 10px; }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud">
      <div class="hud-top">
        <div id="vitals">
          <div class="bar">
            <div class="fill" id="hpGhost"></div>
            <div class="fill" id="hpFill"></div>
            <div class="label"><span>체력</span><span id="hpText">100 / 100</span></div>
          </div>
          <div class="bar" style="height: 13px">
            <div class="fill" id="stamFill"></div>
            <div class="label" style="font-size: 10px">
              <span>스태미나</span><span id="stamText">100</span>
            </div>
          </div>
          <div id="vials">성수병 <b id="vialText">3 / 3</b> <span class="dim">(X)</span></div>
        </div>

        <!-- 화톳불 안내 — 가까이 갔을 때만 뜹니다 -->
        <div id="restHint"><b id="restLabel">화톳불</b><div class="bar"><div class="fill" id="restFill"></div></div></div>

        <!-- 저체력 경고. 체력이 낮을수록 붉게 맥동합니다. -->
        <div id="lowHp"></div>

        <div class="panel" id="stats">
          <div id="arenaStats">
            <div>웨이브 <b id="waveText">1</b></div>
            <div>남은 적 <b id="enemyText">0</b></div>
            <div>처치 <b id="killText">0</b></div>
          </div>
          <div id="levelStats" style="display: none">
            <div id="levelNameText" style="color: #ffd479; font-weight: 600"></div>
            <div id="regionText" style="color: #9fd2ff; font-size: 11.5px"></div>
            <div style="margin-top: 4px">남은 적 <b id="levelEnemyText">0</b></div>
            <div>보물 <b id="treasureText">0 / 0</b></div>
            <div id="saveText" class="saveNote"></div>
            <div
              id="objectiveText"
              style="margin-top: 5px; padding-top: 5px; border-top: 1px solid rgba(150,175,220,0.18)"
            ></div>
          </div>
          <div class="dim" id="perfText">60 fps</div>
        </div>
      </div>

      <div class="hud-bottom" style="flex-direction: column; align-items: center">
        <div id="loadout">
          <div id="weaponName">롱소드</div>
          <div id="slots">
            <div class="slot" id="slot0"><span class="cd"></span><span class="cdText"></span><span class="key">Q</span><span class="nm">-</span></div>
            <div class="slot" id="slot1"><span class="cd"></span><span class="cdText"></span><span class="key">E</span><span class="nm">-</span></div>
            <div class="slot" id="slot2"><span class="cd"></span><span class="cdText"></span><span class="key">R</span><span class="nm">-</span></div>
            <div class="slot" id="slot3"><span class="cd"></span><span class="cdText"></span><span class="key">F</span><span class="nm">-</span></div>
            <div class="slot" id="slot4"><span class="cd"></span><span class="cdText"></span><span class="key">G</span><span class="nm">-</span></div>
          </div>
        </div>
        <div id="controls">
          <div class="key"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 이동</div>
          <div class="key"><kbd>마우스</kbd> 조준</div>
          <div class="key"><kbd>좌클릭</kbd> 공격 (3타 콤보)</div>
          <div class="key"><kbd>Space</kbd> 회피 구르기 (무적)</div>
          <div class="key"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 무기 교체</div>
          <div class="key"><kbd>Tab</kbd><kbd>C</kbd> 룬 교체</div>
          <div class="key"><kbd>T</kbd> 트라이포드</div>
          <div class="key"><kbd>X</kbd> 성수병 (회복)</div>
          <div class="key"><kbd>M</kbd> 소리 끄기/켜기</div>
          <a class="key" href="./?mode=arena" style="color: #9fd2ff; text-decoration: none"
            >⚔ 전투 시험장</a
          >
          <a class="key" href="./editor.html" style="color: #ffd479; text-decoration: none"
            >🛠 레벨 에디터</a
          >
        </div>
      </div>
    </div>


    <div id="tripod">
      <div class="tpTop">
        <div>
          <h2>트라이포드 — 스킬 변형</h2>
          <div class="sub">각인석 <b id="tripodPoints" style="color:#ffd479">0</b> · 보물에서 얻습니다</div>
        </div>
        <button id="tripodClose">닫기 (T)</button>
      </div>
      <div id="tripodBody"></div>
      <div class="tpFoot">
        <button id="resetProgress">진행 초기화</button>
        <span>이 레벨의 각인석 · 룬 · 먹은 보물을 전부 지웁니다</span>
      </div>
    </div>

    <div id="banner">
      <div class="big" id="bannerTitle"></div>
      <div class="sub" id="bannerSub"></div>
      <button id="restart">다시 시작</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
